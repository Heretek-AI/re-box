# Minimal CI skeleton for M4. Full content (matrix, caching, engine
# verification, smoke.sh) lands in M8. For now: build the image and run the
# in-Dockerfile acceptance checks (the build itself fails on mismatch).
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t re-box:m4 .
      # M8 adds: run scripts/smoke.sh (end-to-end investigation in container).
